<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeroporto Inteligente - Simulação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="painel-aeroporto">
        <h1>Torre de Controle</h1>

        <div id="pista">
            <div id="aviao">✈️</div>
        </div>

        <div class="info-voo">
            <p><strong>Voo:</strong> <span id="display-codigo">---</span></p>
            <p><strong>Rota:</strong> <span id="display-rota">---</span></p>
            <p><strong>Status:</strong> <span id="display-status">Aguardando</span></p>
            <p><strong>Altitude:</strong> <span id="display-altitude">0</span> pés</p>
        </div>

        <div class="controles">
            <button class="btn-decolar" onclick="comandarDecolagem()">Decolar</button>
            <button class="btn-pousar" onclick="comandarPouso()">Pousar</button>
            <button onclick="ativarSuper()" style="background-color: #6a1b9a; color: white;">Ativar Supersônico</button>
            <button onclick="carregarAviao()" style="background-color: #2e7d32; color: white;">Embarcar Carga</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
